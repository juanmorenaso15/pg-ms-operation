server:
  port: 8082

spring:
  application:
    name: pg-ms-operation
    
  datasource:
    url: ${SUPABASE_URL_OPERATION}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      pool-name: HikariPool-Operation
      data-source-properties:
        prepareThreshold: 0 
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        register: true
        health-check-path: /actuator/health
        prefer-ip-address: false
        instance-id: ${spring.application.name}

microservicio:
  usuarios:
    url: http://pg-ms-users:8081
  reports:
    url: http://pg-ms-reports:8084


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret-key: ${JWT_SECRET}
    token-expiration: 3600000

logging:
  level:
    com.pulse_gym: DEBUG

biometric:
  jwt:
    secret-key: ${BIOMETRIC_JWT_SECRET}
    token-expiration: 300000